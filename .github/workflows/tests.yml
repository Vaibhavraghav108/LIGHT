name: LIGHT CI

on:
  push:
    branches:
      - main
      - feature/*
      - fix/*
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Unit & Browser Integration Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Upgrade pip and install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install browser-use==0.13.10 ollama==0.6.1

      - name: Install Playwright Chromium browser
        run: |
          python -m playwright install chromium

      - name: Static compilation syntax check
        run: |
          python -m compileall -q main.py config.py voice brain computer browser core utils tests

      - name: Run automated test discovery suite
        run: |
          python -m unittest discover -s tests -v
